name: Backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Format and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format and test
        run: npm run backend:check
